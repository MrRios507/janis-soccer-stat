gender = "male"
is_collected = true

[[sources]]
slug = "football-data"
name = "football-data.co.uk"
base_url = "https://www.football-data.co.uk/"
# The publisher states no request limit, so the most cautious delay it knows
# applies rather than none, and it is recorded as assumed (UC-015 A3, BR-003).
rate_limit_ms = 2000
rate_limit_is_assumed = true
is_active = true
